name: 🐛 Bug report
description: Report a problem with the CLI, an agent, or a skill
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact command run (e.g. `npx @s2bp/ai-led-framework init --trigram=ZZM`).
      placeholder: |
        1. Run `...`
        2. See error `...`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Framework version
      description: Output of `npx @s2bp/ai-led-framework --version` (or the version in package.json).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and Claude Code version if relevant.
      placeholder: "Node 20.11, macOS 14, Claude Code x.y"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any relevant terminal output (redact secrets).
      render: shell
