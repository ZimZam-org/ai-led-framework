name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Show CLI help (smoke test)
        run: npm test
      - name: Verify installer runs against a fresh project
        run: |
          mkdir -p /tmp/ai-led-smoke && cd /tmp/ai-led-smoke
          node "$GITHUB_WORKSPACE/bin/ai-led.js" init --trigram=TST -y
          test -d .claude && test -d memory

      - name: Verify the dashboard splits shell from payload
        run: |
          cd /tmp/ai-led-smoke
          node "$GITHUB_WORKSPACE/bin/ai-led.js" status --html
          test -s ailed-status.html
          test -s .ailed/status/data.js
          # the payload is a global assignment loaded by a <script> tag, never fetch()
          grep -q "window.__AILED__ = " .ailed/status/data.js
          grep -q "status/data.js" ailed-status.html
          # the shell carries no project data of its own
          ! grep -q "window.__AILED__ = {" ailed-status.html
          # --snapshot is the opposite: one self-contained file, no external payload
          node "$GITHUB_WORKSPACE/bin/ai-led.js" status --html --snapshot --out=/tmp/snap.html
          grep -q "window.__AILED__ = " /tmp/snap.html
          ! grep -q 'script src="[^h]' /tmp/snap.html
          node "$GITHUB_WORKSPACE/bin/ai-led.js" clean

      - name: Verify the hook journals kanban transitions without inventing history
        run: |
          cd /tmp/ai-led-smoke
          HOOK=.claude/hooks/ailed-runtime-hook.js
          printf '| TST-000001 | 2026-01-01 | `TODO` | EPIC-1 | seed | d | s |\n' >> memory/kanban.md
          # first run only records a baseline: no transition may be fabricated
          echo "{\"cwd\":\"$PWD\",\"tool_name\":\"Edit\"}" | node "$HOOK" post
          test -s .ailed/kanban-state.json
          test ! -f .ailed/journal.jsonl
          # a real status change is journaled, even when made by sed through Bash
          sed -i 's/`TODO` | EPIC-1 | seed/`IN_PROGRESS` | EPIC-1 | seed/' memory/kanban.md
          echo "{\"cwd\":\"$PWD\",\"tool_name\":\"Bash\"}" | node "$HOOK" post
          grep -q '"id":"TST-000001"' .ailed/journal.jsonl
          grep -q '"from":"TODO","to":"IN_PROGRESS"' .ailed/journal.jsonl
          # an unchanged kanban must not append anything
          BEFORE=$(wc -l < .ailed/journal.jsonl)
          echo "{\"cwd\":\"$PWD\",\"tool_name\":\"Read\"}" | node "$HOOK" post
          test "$BEFORE" = "$(wc -l < .ailed/journal.jsonl)"

      - name: Verify update preserves project data and re-wires the hook
        run: |
          cd /tmp/ai-led-smoke
          printf '\n## Section maison\n\nNe pas ecraser.\n' >> memory/project-state.md
          printf '\n## Regles maison\n\nNe pas ecraser.\n' >> CLAUDE.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" update -y
          grep -q "Section maison" memory/project-state.md
          grep -q "Regles maison" CLAUDE.md
          grep -q "TST-000001" memory/kanban.md
          # PostToolUse must reach every tool, or the ticket journal misses sed-style edits
          node -e "const h=require('/tmp/ai-led-smoke/.claude/settings.json').hooks;
            const m=h.PostToolUse.filter(e=>e.hooks.some(x=>x.command.includes('ailed-runtime-hook')));
            if(m.length!==1) throw new Error('expected exactly one ailed PostToolUse entry, got '+m.length);
            if(m[0].matcher!=='*') throw new Error('expected matcher *, got '+m[0].matcher);"
          # generated reports must never be able to land in git
          for pat in ".ailed/" "ailed-status.html" "*_ailed-status.html" "*_ailed-memory-diff.html"; do
            grep -qxF "$pat" .gitignore || { echo "missing .gitignore entry: $pat"; exit 1; }
          done
          # and the entries live in a single AI-Led block, not one header per version
          test "$(grep -c '^# AI-Led' .gitignore)" = "1"

      - name: Verify doctor reports what update used to degrade in silence
        run: |
          cd /tmp/ai-led-smoke
          # a healthy install must be fully green, and usable as a CI gate
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor --quiet
          # the contract is what makes memory/ authoritative outside an explicit agent call
          grep -q "ai-led:begin" CLAUDE.md
          test "$(grep -c 'ai-led:begin' CLAUDE.md)" = "1"
          grep -q "Version du framework installée" memory/config.md
          # a deleted integration row used to install its agent disabled, without a word
          node -e "const fs=require('fs'),f='memory/config.md';
            fs.writeFileSync(f, fs.readFileSync(f,'utf8').replace(/^\| SEO \/ ASO.*\n/m, ''));"
          ! node "$GITHUB_WORKSPACE/bin/ai-led.js" update -y
          node "$GITHUB_WORKSPACE/bin/ai-led.js" update -y --force
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor | grep -q "SEO / ASO"
          # --refresh-rules restores the template body of the rule files
          node "$GITHUB_WORKSPACE/bin/ai-led.js" update -y --refresh-rules=config.md --force
          grep -q "^| SEO / ASO" memory/config.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor --quiet

      - name: Verify the kanban volume checks measure cells and prose, not rows
        run: |
          mkdir -p /tmp/ai-led-vol && cd /tmp/ai-led-vol
          node "$GITHUB_WORKSPACE/bin/ai-led.js" init --trigram=VOL -y
          # a normal ticket carrying description + scope + acceptance criteria is fine, even
          # though the whole row is well past a kilobyte: the cap is per cell, not per row
          OK=$(node -e "const c=(n)=>'x'.repeat(n);console.log('| VOL-000001 | 2026-01-01 | \`TODO\` | E1 | t | '+c(800)+' | s | '+c(800)+' | '+c(800)+' |')")
          printf '%s\n' "$OK" >> memory/kanban.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor | grep -v "cellule(s) dépassent"
          # one cell holding an essay is not
          BAD=$(node -e "console.log('| VOL-000002 | 2026-01-02 | \`TODO\` | E1 | t | '+'y'.repeat(2000)+' | s | d | m |')")
          printf '%s\n' "$BAD" >> memory/kanban.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor | grep -q "VOL-000002"
          # and a kanban that is mostly narrative is reported for what it is
          node -e "const fs=require('fs');fs.appendFileSync('memory/kanban.md','\n'+'Un récit qui ne tient pas dans un tableau.\n'.repeat(1200));"
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor | grep -q "n'est pas une ligne de ticket"

      - name: Verify a bold status is still a status, everywhere
        run: |
          mkdir -p /tmp/ai-led-bold && cd /tmp/ai-led-bold
          node "$GITHUB_WORKSPACE/bin/ai-led.js" init --trigram=BLD -y
          printf '| BLD-000001 | 2026-01-01 | `TODO` | E1 | a | d | s |\n' >> memory/kanban.md
          printf '| BLD-000002 | 2026-01-02 | **TO_TEST** | E1 | b | d | s |\n' >> memory/kanban.md
          # the emphasised row must be counted, not silently dropped from the totals
          node "$GITHUB_WORKSPACE/bin/ai-led.js" status | grep -q "TO_TEST 1"
          node "$GITHUB_WORKSPACE/bin/ai-led.js" doctor | grep -q "statuts sont canoniques"
          # and it must reach the ticket journal through the hook
          echo "{\"cwd\":\"$PWD\",\"tool_name\":\"Edit\"}" | node .claude/hooks/ailed-runtime-hook.js post
          grep -q '"BLD-000002": "TO_TEST"' .ailed/kanban-state.json

      - name: Verify archive moves every ticket and loses none
        run: |
          cd /tmp/ai-led-bold
          printf '| BLD-000003 | 2026-01-03 | `DONE` | E1 | c | d | s |\n' >> memory/kanban.md
          printf '| BLD-000004 | 2026-01-04 | `DONE` | E1 | e | d | s |\n' >> memory/kanban.md
          # dry run by default: the live file must not move
          BEFORE=$(wc -c < memory/kanban.md)
          node "$GITHUB_WORKSPACE/bin/ai-led.js" archive
          test "$BEFORE" = "$(wc -c < memory/kanban.md)"
          node "$GITHUB_WORKSPACE/bin/ai-led.js" archive --apply
          test -s memory/archive/kanban.md
          grep -q "BLD-000003" memory/archive/kanban.md
          grep -q "BLD-000004" memory/archive/kanban.md
          ! grep -q "BLD-000003" memory/kanban.md
          # live tickets stay put, and nothing is lost: status still sees all four
          grep -q "BLD-000001" memory/kanban.md
          grep -q "BLD-000002" memory/kanban.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" status | grep -q "DONE 2"
          grep -q "Archives : memory/archive/kanban.md" memory/kanban.md
          # --keep protects the most recent ones
          node "$GITHUB_WORKSPACE/bin/ai-led.js" archive --status=TO_TEST --keep=1 --apply
          grep -q "BLD-000002" memory/kanban.md
          # every EPIC section repeats the same table header, so a row must not be keyed
          # by "header + index": two candidates at the same index in two sections would
          # then share a key, and --keep would move both when it picked only one.
          mkdir -p /tmp/ai-led-col && cd /tmp/ai-led-col
          node "$GITHUB_WORKSPACE/bin/ai-led.js" init --trigram=COL -y
          H='| ID | Date création | Status | EPIC | Titre | Description | Solution(s) | Détail technique | Maquette |'
          S='| -- | ------------- | ------ | ---- | ----- | ----------- | ----------- | ---------------- | -------- |'
          printf '\n### E-A\n%s\n%s\n| COL-000001 | 2026-01-01 | `DONE` | E-A | a | d | s | t | m |\n' "$H" "$S" >> memory/kanban.md
          printf '\n### E-B\n%s\n%s\n| COL-000003 | 2026-01-03 | `DONE` | E-B | c | d | s | t | m |\n' "$H" "$S" >> memory/kanban.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" archive --keep=1 --apply
          grep -q '^| COL-000001' memory/archive/kanban.md
          ! grep -q '^| COL-000003' memory/archive/kanban.md
          grep -q '^| COL-000003' memory/kanban.md

      - name: Verify the writing standard ships, checks and can be disabled
        run: |
          # the framework's own memory templates must pass their own standard
          node "$GITHUB_WORKSPACE/bin/ai-led.js" lint --strict "$GITHUB_WORKSPACE/templates/memory/fr"
          node "$GITHUB_WORKSPACE/bin/ai-led.js" lint --strict --lang=en "$GITHUB_WORKSPACE/templates/memory/en"
          cd /tmp/ai-led-smoke
          test -s memory/writing-rules.md
          grep -q 'Norme de rédaction des textes produits : `ste`' memory/config.md
          grep -q '## Rédaction (norme `ste`)' .claude/agents/ailed-dev.md
          grep -q '## Rédaction (norme `ste`)' .claude/skills/status/SKILL.md
          ! grep -rq 'WRITING_RULES' .claude/
          # the checker runs on the installed memory/ and names its own rules file
          node "$GITHUB_WORKSPACE/bin/ai-led.js" lint | tee /tmp/lint.txt
          grep -q "writing-rules.md" /tmp/lint.txt
          # a project installed before the standard gets it back through update
          rm memory/writing-rules.md
          node -e "const fs=require('fs'),f='memory/config.md';
            fs.writeFileSync(f, fs.readFileSync(f,'utf8')
              .replace(/## Rédaction[\s\S]*?(?=## Conventions techniques)/, '') + '\n## Section redac maison\n');"
          node "$GITHUB_WORKSPACE/bin/ai-led.js" update -y
          test -s memory/writing-rules.md
          grep -q '^## Rédaction' memory/config.md
          grep -q 'Section redac maison' memory/config.md
          # and a fresh project with the norm off carries no rule block at all
          mkdir -p /tmp/ai-led-nostd && cd /tmp/ai-led-nostd
          node "$GITHUB_WORKSPACE/bin/ai-led.js" init --trigram=TST -y --writing=aucun
          grep -q 'Norme de rédaction des textes produits : `aucun`' memory/config.md
          ! grep -q '## Rédaction (norme' .claude/agents/ailed-dev.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" lint | grep -q "désactivée"

      - name: Verify memory-diff against a committed then edited memory/
        run: |
          cd /tmp/ai-led-smoke
          git init -q .
          git config user.email ci@example.com && git config user.name CI
          git add -A && git commit -qm "init"
          printf '\n## Section ajoutee par le test\n- TST-000001\n' >> memory/decisions.md
          node "$GITHUB_WORKSPACE/bin/ai-led.js" memory-diff | tee /tmp/diff.txt
          grep -q "memory/decisions.md" /tmp/diff.txt
          grep -q "TST-000001" /tmp/diff.txt
          node "$GITHUB_WORKSPACE/bin/ai-led.js" memory-diff --html --out=/tmp/diff.html
          test -s /tmp/diff.html
          ! grep -q "<script" /tmp/diff.html
